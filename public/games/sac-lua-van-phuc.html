    /* =========================================================================
       2. AUDIO SYNTHESIZER (WEB AUDIO API)
       ========================================================================= */
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playPop() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(850, now + 0.06);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
      playShuttle() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const size = this.ctx.sampleRate * 0.2;
        const buffer = this.ctx.createBuffer(1, size, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(900, now);
        filter.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
        filter.Q.value = 3;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
        noise.stop(now + 0.21);
      }
      playClack() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.12);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      }
      playChime(note = 0) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const freqs = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(freqs[note % freqs.length], now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 1.25);
      }
      playSteam() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const size = this.ctx.sampleRate * 0.35;
        const buf = this.ctx.createBuffer(1, size, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, now);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
        noise.stop(now + 0.36);
      }
    }

    function renderSilkSVG(p, baseHex, tex, motifs, selId = null, weaveProg = 100, isDraped = true) {
      const isSq = p.id === 'square-scarf';
      const isLg = p.id === 'long-scarf';
      const isTt = p.id === 'tote-bag';
      const w = p.width;
      const h = p.height;
      const visH = (h * weaveProg) / 100;

      let shapes = '';
      if (isSq) {
        shapes = `
          <rect x="14" y="14" width="${w-28}" height="${h-28}" rx="8" fill="#000" opacity="0.15"/>
          <rect x="18" y="18" width="${w-36}" height="${h-36}" rx="6" fill="${baseHex}"/>
          <rect x="18" y="18" width="${w-36}" height="${h-36}" rx="6" fill="none" stroke="#D4A344" stroke-width="3.5" opacity="0.85"/>
          <rect x="26" y="26" width="${w-52}" height="${h-52}" rx="4" fill="none" stroke="#FFF" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
        `;
      } else if (isLg) {
        let leftF = '', rightF = '';
        for (let i = 0; i < 22; i++) {
          const y = 26 + (i * (h - 52)) / 21;
          leftF += `<path d="M 16 ${y} C 10 ${y-2} 4 ${y + (i%2===0?3:-3)} 0 ${y}" stroke="${baseHex}" stroke-width="2.5" opacity="0.9"/>`;
          rightF += `<path d="M ${w-16} ${y} C ${w-10} ${y-2} ${w-4} ${y + (i%2===0?3:-3)} ${w} ${y}" stroke="${baseHex}" stroke-width="2.5" opacity="0.9"/>`;
        }
        shapes = `
          ${leftF} ${rightF}
          <rect x="16" y="16" width="${w-32}" height="${h-32}" rx="4" fill="${baseHex}"/>
          <line x1="16" y1="20" x2="${w-16}" y2="20" stroke="#FFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
          <line x1="16" y1="${h-20}" x2="${w-16}" y2="${h-20}" stroke="#FFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
        `;
      } else {
        shapes = `
          <path d="M 120 90 C 120 20 320 20 320 90" fill="none" stroke="#B8860B" stroke-width="16" stroke-linecap="round"/>
          <circle cx="160" cy="38" r="4" fill="#6B4E1B"/><circle cx="220" cy="22" r="4" fill="#6B4E1B"/><circle cx="280" cy="38" r="4" fill="#6B4E1B"/>
          <path d="M 38 85 Q 220 73 402 85 L 392 462 Q 220 484 48 462 Z" fill="#000" opacity="0.2"/>
          <path d="M 40 85 Q 220 75 400 85 L 390 460 Q 220 480 50 460 Z" fill="${baseHex}"/>
          <path d="M 40 85 Q 220 75 400 85" fill="none" stroke="#FFF" stroke-width="2" stroke-dasharray="4 3" opacity="0.4"/>
        `;
      }

      // Render Motifs
      let motifElements = motifs.map(m => {
        const def = MOTIFS.find(d => d.id === m.motifId);
        if (!def) return '';
        const isSel = selId === m.id;
        const color = m.color || '#E5BF5A';
        const sx = m.flipX ? -m.scale : m.scale;
        const sy = m.flipY ? -m.scale : m.scale;

        return `
          <g transform="translate(${m.x}, ${m.y}) rotate(${m.rotation}) scale(${sx}, ${sy}) translate(-50, -50)" class="cursor-pointer" onclick="selectMotif('${m.id}', event)">
            <path d="${def.path}" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.2" transform="translate(1.5, 1.5)"/>

            ${isSel ? `
              <rect x="-4" y="-4" width="108" height="108" fill="none" stroke="#D4A344" stroke-width="2" stroke-dasharray="4 4" rx="4"/>
              <circle cx="50" cy="-14" r="5" fill="#D4A344"/>
            ` : ''}
          </g>
        `;
      }).join('');

      return `
        <svg viewBox="0 0 ${w} ${h}" class="w-full h-auto drop-shadow-2xl select-none" style="max-height: 440px;" onclick="deselectMotif(event)">
          <defs>
            <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF" stop-opacity="0.25"/>
              <stop offset="50%" stop-color="#000" stop-opacity="0.1"/>
              <stop offset="100%" stop-color="#FFF" stop-opacity="0.18"/>
            </linearGradient>
            ${weaveProg < 100 ? `
              <clipPath id="loom-clip">
                <rect x="0" y="${h - visH}" width="${w}" height="${visH}"/>
              </clipPath>
            ` : ''}
          </defs>
          <g ${weaveProg < 100 ? 'clip-path="url(#loom-clip)"' : ''}>
            ${shapes}
            <g id="motifs-container">${motifElements}</g>
            ${isDraped ? `<rect x="0" y="0" width="${w}" height="${h}" fill="url(#sheen)" style="mix-blend-mode: overlay;" pointer-events="none"/>` : ''}
          </g>
        </svg>
      `;
    }

                    <div class="flex justify-between text-xs font-bold">

                    </div>
                    ${state.finishProgress < 100 ? `
                      <button onclick="finishProcess()" class="w-full py-3.5 rounded-xl bg-bamboo-600 text-white font-bold text-sm shadow hover:bg-bamboo-500">

                      </button>
                    `}
                  </div>

            ` : ''}
          </div>
        </div>
      `;
    }

    /* =========================================================================
       10. EVENT HANDLERS & INTERACTIONS
       ========================================================================= */
    function goToStep(s) {
      sound.playPop();
      state.step = s;
      if (s === 4) {
        try {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          sound.playChime(3);
        } catch(e) {}
      }
      renderApp();
    }

    function chooseProduct(id) {
      sound.playPop();
      state.product = PRODUCTS.find(p => p.id === id) || PRODUCTS[0];
      renderApp();
    }

    function setTab(tab) {
      sound.playPop();
      state.activeTab = tab;
      renderApp();
    }

    function setMotifCategory(cat) {
      sound.playPop();
      state.motifCategory = cat;
      renderApp();
    }

    function setBaseColor(id) {
      sound.playPop();
      state.baseColor = SILK_COLORS.find(c => c.id === id) || SILK_COLORS[0];
      state.customBaseHex = null;
      renderApp();
    }

    function setThreadColor(id) {
      sound.playPop();
      state.threadColor = THREAD_COLORS.find(th => th.id === id) || THREAD_COLORS[0];
      if (state.selectedMotifId) {
        const m = state.motifs.find(it => it.id === state.selectedMotifId);
        if (m) m.color = state.threadColor.hex;
      }
      renderApp();
    }

    function addMotif(id) {
      sound.playPop();
      const def = MOTIFS.find(m => m.id === id);
      if (!def) return;
      const newM = {
        id: `m-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
        motifId: def.id,
        x: state.product.width / 2 + (state.motifs.length % 3) * 15,
        y: state.product.height / 2 + (state.motifs.length % 2) * 15,
        scale: def.scale,
        rotation: 0,
        color: state.threadColor.hex,
        flipX: false,
        flipY: false
      };
      state.motifs.push(newM);
      state.selectedMotifId = newM.id;
      renderApp();
    }

    function selectMotif(id, e) {
      if (e) e.stopPropagation();
      sound.playPop();
      state.selectedMotifId = id;
      renderApp();
    }

    function deselectMotif(e) {
      if (e.target.tagName === 'svg') {
        state.selectedMotifId = null;
        renderApp();
      }
    }

    function scaleMotif(f) {
      sound.playPop();
      const m = state.motifs.find(it => it.id === state.selectedMotifId);
      if (m) {
        m.scale = Math.max(0.4, Math.min(2.5, +(m.scale * f).toFixed(2)));
        renderApp();
      }
    }

    function rotateMotif(deg) {
      sound.playPop();
      const m = state.motifs.find(it => it.id === state.selectedMotifId);
      if (m) {
        m.rotation = (m.rotation + deg + 360) % 360;
        renderApp();
      }
    }

    function flipMotif(axis) {
      sound.playPop();
      const m = state.motifs.find(it => it.id === state.selectedMotifId);
      if (m) {
        if (axis === 'x') m.flipX = !m.flipX;
        if (axis === 'y') m.flipY = !m.flipY;
        renderApp();
      }
    }

    function centerMotif() {
      sound.playPop();
      const m = state.motifs.find(it => it.id === state.selectedMotifId);
      if (m) {
        m.x = state.product.width / 2;
        m.y = state.product.height / 2;
        renderApp();
      }
    }

    function duplicateMotif() {
      sound.playPop();
      const m = state.motifs.find(it => it.id === state.selectedMotifId);
      if (m) {
        const clone = { ...m, id: `m-${Date.now()}`, x: m.x + 25, y: m.y + 25 };
        state.motifs.push(clone);
        state.selectedMotifId = clone.id;
        renderApp();
      }
    }

    function deleteSelectedMotif() {
      sound.playPop();
      state.motifs = state.motifs.filter(it => it.id !== state.selectedMotifId);
      state.selectedMotifId = null;
      renderApp();
    }

    function applySymmetry4() {
      const sel = state.motifs.find(it => it.id === state.selectedMotifId);
      if (!sel) return;
      sound.playChime(1);
      const w = state.product.width;
      const h = state.product.height;
      const inset = 80;
      state.motifs = [
        ...state.motifs.filter(it => it.id !== sel.id),
        { ...sel, id: `s1-${Date.now()}`, x: inset, y: inset, rotation: 0, flipX: false, flipY: false },
        { ...sel, id: `s2-${Date.now()}`, x: w - inset, y: inset, rotation: 90, flipX: true, flipY: false },
        { ...sel, id: `s3-${Date.now()}`, x: w - inset, y: h - inset, rotation: 180, flipX: true, flipY: true },
        { ...sel, id: `s4-${Date.now()}`, x: inset, y: h - inset, rotation: 270, flipX: false, flipY: true }
      ];
      renderApp();
    }

    function applyScatterRepeat() {
      const sel = state.motifs.find(it => it.id === state.selectedMotifId);
      if (!sel) return;
      sound.playChime(2);
      const w = state.product.width;
      const h = state.product.height;
      const list = [];
      const cols = state.product.id === 'long-scarf' ? 5 : 3;
      const rows = state.product.id === 'long-scarf' ? 2 : 3;
      for (let ix = 0; ix < cols; ix++) {
        for (let iy = 0; iy < rows; iy++) {
          list.push({
            ...sel,
            id: `scat-${ix}-${iy}-${Date.now()}`,
            x: (w * (ix + 1)) / (cols + 1),
            y: (h * (iy + 1)) / (rows + 1),
            scale: sel.scale * 0.75,
            rotation: (ix + iy) % 2 === 0 ? 0 : 15
          });
        }
      }
      state.motifs = list;
      renderApp();
    }

    function applyBorderRun() {
      const sel = state.motifs.find(it => it.id === state.selectedMotifId);
      if (!sel) return;
      sound.playChime(1);
      const w = state.product.width;
      const h = state.product.height;
      const list = [];
      for (let x = 60; x <= w - 60; x += 85) {
        list.push({ ...sel, id: `b1-${x}`, x, y: 45, scale: sel.scale * 0.65, rotation: 0 });
        list.push({ ...sel, id: `b2-${x}`, x, y: h - 45, scale: sel.scale * 0.65, rotation: 180 });
      }
      state.motifs = list;
      renderApp();
    }

    function applyPreset(type) {
      sound.playChime(3);
      const w = state.product.width;
      const h = state.product.height;
      if (type === 'van-may') {
        state.baseColor = SILK_COLORS[2]; // Xanh chàm
        state.threadColor = THREAD_COLORS[0]; // Vàng kim tuyến
        state.motifs = [
          { id: 'p1', motifId: 'chim-hac', x: w/2 - 40, y: h/2 - 20, scale: 1.2, rotation: -10, color: '#E5BF5A', flipX: false, flipY: false },
          { id: 'p2', motifId: 'van-may', x: w/2 + 60, y: h/2 + 30, scale: 1.1, rotation: 0, color: '#E5BF5A', flipX: false, flipY: false },
          { id: 'p3', motifId: 'van-may', x: w/2 - 100, y: h/2 + 40, scale: 0.8, rotation: 5, color: '#FFF', flipX: true, flipY: false }
        ];
      } else if (type === 'sen-vang') {
        state.baseColor = SILK_COLORS[4]; // Hồng sen
        state.threadColor = THREAD_COLORS[0];
        state.motifs = [
          { id: 'p1', motifId: 'hoa-sen', x: w/2, y: h/2 - 20, scale: 1.3, rotation: 0, color: '#E5BF5A', flipX: false, flipY: false },
          { id: 'p2', motifId: 'la-sen', x: w/2 - 70, y: h/2 + 50, scale: 0.9, rotation: -15, color: '#FFF', flipX: false, flipY: false },
          { id: 'p3', motifId: 'la-sen', x: w/2 + 70, y: h/2 + 50, scale: 0.9, rotation: 15, color: '#FFF', flipX: true, flipY: false }
        ];
      } else {
        state.baseColor = SILK_COLORS[1]; // Đỏ trầm
        state.threadColor = THREAD_COLORS[0];
        state.motifs = [
          { id: 'p1', motifId: 'chu-phuc', x: w/2, y: h/2, scale: 1.3, rotation: 0, color: '#E5BF5A', flipX: false, flipY: false },
          { id: 'p2', motifId: 'qua-tram', x: 75, y: 75, scale: 0.8, rotation: 0, color: '#E5BF5A', flipX: false, flipY: false },
          { id: 'p3', motifId: 'qua-tram', x: w-75, y: 75, scale: 0.8, rotation: 0, color: '#E5BF5A', flipX: false, flipY: false },
          { id: 'p4', motifId: 'qua-tram', x: 75, y: h-75, scale: 0.8, rotation: 0, color: '#E5BF5A', flipX: false, flipY: false },
          { id: 'p5', motifId: 'qua-tram', x: w-75, y: h-75, scale: 0.8, rotation: 0, color: '#E5BF5A', flipX: false, flipY: false }
        ];
      }
      renderApp();
    }

    /* =========================================================================
       11. LOOM & WEAVING ACTIONS
       ========================================================================= */
    function spinWheel() {
      state.spinAngle += 120;
      sound.playPop();
      state.spinProgress = Math.min(100, state.spinProgress + 25);
      if (state.spinProgress >= 100) sound.playChime(1);
      renderApp();
    }

    function finishWarping() {
      sound.playChime(2);
      state.loomSubStage = 2;
      renderApp();
    }

    function beatLoom() {
      if (state.weaveProgress >= 100) return;
      sound.playShuttle();
      state.shuttleSide = state.shuttleSide === 'left' ? 'right' : 'left';
      renderApp();

      setTimeout(() => {
        sound.playClack();
        state.weaveProgress = Math.min(100, state.weaveProgress + 20);
        renderApp();

        if (state.weaveProgress >= 100) {
          sound.playChime(3);
          setTimeout(() => {
            state.loomSubStage = 3;
            renderApp();
          }, 800);
        }
      }, 300);
    }

    function finishProcess() {
      sound.playSteam();
      state.finishProgress = Math.min(100, state.finishProgress + 35);
      if (state.finishProgress >= 100) sound.playChime(4);
      renderApp();
    }

    function setArtworkName(n) {
      state.artworkName = n;
      renderApp();
    }

    function toggleAudio() {
      sound.enabled = !sound.enabled;
      if (sound.enabled) sound.playPop();
      renderApp();
    }

    function openHelp() {
      sound.playPop();
      state.showHelpModal = true;
      renderApp();
    }

    function closeHelp() {
      state.showHelpModal = false;
      renderApp();
    }

    function resetGame() {
      sound.playPop();
      state.step = 1;
      state.loomSubStage = 1;
      state.spinProgress = 0;
      state.weaveProgress = 0;
      state.finishProgress = 0;
      renderApp();
    }

    /* Spacebar support for weaving */
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && state.step === 3 && state.loomSubStage === 2) {
        e.preventDefault();
        beatLoom();
      }
    });

    /* =========================================================================
       12. PNG EXPORT (OFFSCREEN CANVAS GENERATION)
       ========================================================================= */
    function exportPNG() {
      sound.playPop();
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const scale = 2;
      canvas.width = 800 * scale;
      canvas.height = 950 * scale;
      ctx.scale(scale, scale);

      // Vintage paper bg
      const bg = ctx.createLinearGradient(0, 0, 0, 950);
      bg.addColorStop(0, '#FCF9F2');
      bg.addColorStop(1, '#F3EBDD');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 800, 950);

      // Antique border
      ctx.strokeStyle = '#D4A344';
      ctx.lineWidth = 3;
      ctx.strokeRect(25, 25, 750, 900);
      ctx.lineWidth = 1;
      ctx.strokeRect(32, 32, 736, 886);

      // Title
      ctx.textAlign = 'center';
      ctx.fillStyle = '#C85A32';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('DI SẢN NGHỀ DỆT LỤA TRUYỀN THỐNG VIỆT NAM', 400, 75);

      ctx.fillStyle = '#1F1610';
      ctx.font = 'bold 30px Georgia, serif';
      ctx.fillText('SẮC LỤA VẠN PHÚC', 400, 115);

      ctx.fillStyle = '#79311A';
      ctx.font = 'italic 15px Georgia, serif';
      ctx.fillText(`“${state.artworkName || 'Tuyệt tác tơ tằm'}”`, 400, 145);

      // Silk Shape
      const silkX = 150;
      const silkY = 180;
      const silkW = 500;
      const silkH = state.product.id === 'long-scarf' ? 240 : 420;

      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 25;
      ctx.shadowOffsetY = 15;
      ctx.fillStyle = state.customBaseHex || state.baseColor.hex;
      ctx.fillRect(silkX, silkY, silkW, silkH);

      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#E5BF5A';
      ctx.lineWidth = 3;
      ctx.strokeRect(silkX + 6, silkY + 6, silkW - 12, silkH - 12);

      // Draw motifs
      state.motifs.forEach(m => {
        const def = MOTIFS.find(d => d.id === m.motifId);
        if (!def) return;
        ctx.save();
        const mappedX = silkX + (m.x * silkW) / state.product.width;
        const mappedY = silkY + (m.y * silkH) / state.product.height;
        ctx.translate(mappedX, mappedY);
        ctx.rotate((m.rotation * Math.PI) / 180);
        ctx.scale(m.scale * 0.9, m.scale * 0.9);
        const p2d = new Path2D(def.path);
        ctx.translate(-50, -50);
        ctx.fillStyle = m.color || '#E5BF5A';
        ctx.fill(p2d);
        ctx.restore();
      });

      // Wooden hanger
      ctx.fillStyle = '#4A2E1B';
      ctx.fillRect(silkX - 20, silkY - 14, silkW + 40, 14);

      // Red seal
      const sealX = 640;
      const sealY = 820;
      ctx.strokeStyle = '#BA2D2D';
      ctx.lineWidth = 3;
      ctx.strokeRect(sealX - 35, sealY - 35, 70, 70);
      ctx.fillStyle = 'rgba(186, 45, 45, 0.08)';
      ctx.fillRect(sealX - 35, sealY - 35, 70, 70);
      ctx.fillStyle = '#BA2D2D';
      ctx.textAlign = 'center';
      ctx.font = 'bold 12px serif';
      ctx.fillText('VẠN PHÚC', sealX, sealY - 10);
      ctx.fillText('CHI BẢO', sealX, sealY + 8);
      ctx.font = '9px serif';
      ctx.fillText('HÀ ĐÔNG', sealX, sealY + 23);

      // Specs
      ctx.textAlign = 'left';
      ctx.fillStyle = '#1F1610';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(`Tác giả: ${state.artisanName}`, 60, 800);
      ctx.fillText(`Sản phẩm: ${state.product.name} (${state.product.dims})`, 60, 825);
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#79311A';
      ctx.fillText(`Màu nền: ${state.baseColor.name} • Sợi: ${state.threadColor.name}`, 60, 850);
      ctx.fillText(`Ngày tạo tác: ${new Date().toLocaleDateString('vi-VN')} • Làng lụa Vạn Phúc`, 60, 872);

      // Download
      const dataUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      const clean = (state.artworkName || 'Tac-Pham').replace(/\s+/g, '-');
      a.download = `Sac-Lua-Van-Phuc-${clean}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Initialize application on load
    renderApp();
  </script>
</body>
</html>
